name: Build HMA-OSS future Release for KernelSU

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out the requested upstream fork and its submodules
        uses: actions/checkout@v7
        with:
          repository: Tozward/HMA-OSS
          ref: future
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Install JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Create local.properties and self-build APK signing key
        shell: bash
        run: |
          set -euo pipefail
          : > local.properties
          mkdir -p "$HOME/.android"
          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -alias androiddebugkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname 'CN=Android Debug,O=Android,C=US'
          fi

      - name: Prepare official Gradle build
        run: ./gradlew --no-daemon prebuild

      - name: Build release manager and release Zygisk module
        run: ./gradlew --no-daemon :app:assembleRelease :zygote:assembleRelease

      - name: Validate installable ZIP and record provenance
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(zygote/build/outputs/magisk/release/*.zip)
          if [[ ${#packages[@]} -ne 1 ]]; then
            printf 'Expected 1 release ZIP; found %s\n' "${#packages[@]}" >&2
            exit 1
          fi
          package="${packages[0]}"
          unzip -t "$package" >/dev/null
          unzip -Z -1 "$package" > /tmp/hma-archive-entries.txt
          grep -Fxq 'module.prop' /tmp/hma-archive-entries.txt || {
            echo 'Missing root-level module.prop: not a valid module package' >&2
            exit 1
          }
          grep -Eq '^zygisk/[^/]+\.so$' /tmp/hma-archive-entries.txt || {
            echo 'Missing Zygisk shared library inside the package' >&2
            exit 1
          }
          grep -Fxq 'manager.apk' /tmp/hma-archive-entries.txt || {
            echo 'Missing bundled manager.apk inside the package' >&2
            exit 1
          }
          commit="$(git rev-parse HEAD)"
          checksum="$(sha256sum "$package")"
          echo "RELEASE_ZIP=$package" >> "$GITHUB_ENV"
          {
            echo '## HMA-OSS future Release'
            echo ''
            printf '%s\n' '- Source: Tozward/HMA-OSS, branch `future`'
            printf '%s\n' "- Commit: $commit"
            printf '%s\n' "- Artifact: $(basename "$package")"
            printf '%s\n' "- SHA-256: $checksum"
            echo '- Archive integrity, module.prop, manager.apk and Zygisk library verified.'
            echo '- **This is a community build signed with a CI debug key, not the upstream official signing certificate.**'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      - name: Upload flashable Release ZIP (no outer ZIP wrapper)
        uses: actions/upload-artifact@v7
        with:
          name: HMA-OSS-future-KernelSU-Release
          path: ${{ env.RELEASE_ZIP }}
          archive: false
          if-no-files-found: error
          retention-days: 30
